# prek / pre-commit hooks — https://prek.j178.dev/
# See https://pre-commit.com for hook options
exclude: ".copier-answers.yml|.all-contributorsrc"
default_stages: [pre-commit]

ci:
  autofix_commit_msg: "chore(pre-commit.ci): auto fixes"
  autoupdate_commit_msg: "chore(pre-commit.ci): pre-commit autoupdate"

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy icomon_kitchen
        language: system
        pass_filenames: false
        files: ^icomon_kitchen/.*\.py$

      - id: pytest-changed
        name: pytest (changed)
        entry: uv run python scripts/run_changed_tests.py
        language: system
        pass_filenames: false
        files: ^(icomon_kitchen|tests)/
